<?xml version="1.0"?>
<def format="2">
  <!-- ROS calls these virtual hooks through LifecycleNode's state machine. -->
  <entrypoint name="on_configure"/>
  <entrypoint name="on_activate"/>
  <entrypoint name="on_deactivate"/>
  <entrypoint name="on_cleanup"/>
  <entrypoint name="on_shutdown"/>
  <entrypoint name="on_error"/>
  <!-- GoogleTest invokes fixture lifecycle hooks through its registration API. -->
  <entrypoint name="SetUpTestSuite"/>
  <entrypoint name="TearDownTestSuite"/>
  <entrypoint name="SetUp"/>
  <entrypoint name="TearDown"/>
</def>
