name: Sanitizers

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HAND_REPOSITORY: ${{ vars.LINKERBOT_HAND_CPP_REPOSITORY || format('{0}/linkerbot-hand-cpp-sdk', github.repository_owner) }}
  HAND_REF: ${{ vars.LINKERBOT_HAND_CPP_REF || 'd88813f302553f056bfdd71b40b037738bd6975a' }}
  COMM_REPOSITORY: ${{ vars.LINKERBOT_COMM_REPOSITORY || format('{0}/linkerbot-transport-cpp', github.repository_owner) }}
  COMM_REF: ${{ vars.LINKERBOT_COMM_REF || '0e190032d65ed0b315337b45b3779cf4f650ed68' }}

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check C++ validation helpers and workflows
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          python -m pip install -r requirements/ci-lint.txt
          ruff check tests/cpp
          ruff format --check tests/cpp
          python -m unittest discover -s tests/cpp -p 'test_quality_tools.py'
          shellcheck --severity=warning tests/cpp/*.sh
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
  sanitizers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan, LSan and UBSan
            mode: asan-lsan-ubsan
            address: 'ON'
            thread: 'OFF'
            container-options: ''
            cc: gcc-13
            cxx: g++-13
          - name: TSan
            mode: tsan
            address: 'OFF'
            thread: 'ON'
            container-options: '--security-opt seccomp=unconfined'
            cc: clang-20
            cxx: clang++-20
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
      options: ${{ matrix.container-options }}
    timeout-minutes: 45
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      LINKERBOT_ROS_CPP_SANITIZERS: ${{ matrix.address }}
      LINKERBOT_ROS_CPP_TSAN: ${{ matrix.thread }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:external_symbolizer_path=/usr/bin/llvm-symbolizer-20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cpp
        with:
          hand-repository: ${{ env.HAND_REPOSITORY }}
          hand-ref: ${{ env.HAND_REF }}
          transport-repository: ${{ env.COMM_REPOSITORY }}
          transport-ref: ${{ env.COMM_REF }}
      - name: Install LLVM thread sanitizer runtime
        if: matrix.thread == 'ON'
        run: apt-get install -y --no-install-recommends clang-20 libclang-rt-20-dev llvm-20
      - name: Set offline configuration directory
        run: echo "XDG_CONFIG_HOME=${RUNNER_TEMP}/xdg-config" >> "$GITHUB_ENV"
      - name: Build and run instrumented ROS C++ tests
        run: |
          source /opt/ros/jazzy/setup.bash
          runner=(bash)
          if [[ "$LINKERBOT_ROS_CPP_TSAN" == ON ]]; then
            # TSan's fixed shadow mappings require a process without ASLR.
            runner=(setarch "$(uname -m)" -R bash)
          fi
          "${runner[@]}" tests/cpp/verify.sh external/linkerbot-hand-cpp-sdk \
            external/linkerbot-transport-cpp "$PWD/reports/cpp"
      - name: Upload sanitizer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizers-${{ matrix.mode }}-ubuntu-24.04
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/cpp/*.txt
            reports/cpp/build-log/
            reports/cpp/test-log/
            reports/cpp/ros-logs/
            reports/cpp/sanitizer-reports/
            reports/cpp/build/linkerbot_hand_ros_cpp/test_results/
